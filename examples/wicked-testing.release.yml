# historical-doc — example release config for the retired wicked-testing package
# (retired 2026-08, Phase 6); kept as a teaching example of the shared workflow.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    uses: mikeparcewski/wicked-ci/.github/workflows/node-release.yml@v1
    with:
      package_name: wicked-testing
    secrets: inherit
