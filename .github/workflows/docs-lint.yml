# Reusable docs-lint workflow (DT-21, recon-2026-08 docs-R25).
#
# Fails on retired product names (wicked-testing / wicked-brain /
# wicked-signals) outside <!-- historical --> markers and exempt paths, and
# smoke-validates documented install commands parse-level (npm / npx /
# cargo install / claude plugin) against a static family registry — no
# network. Scope contract: docs/docs-lint-scope.md in this repo.
#
# Caller (SHA-pin the ref per the README's pinning policy):
#
#   jobs:
#     docs-lint:
#       uses: mikeparcewski/wicked-ci/.github/workflows/docs-lint.yml@v1
#
name: docs-lint

on:
  workflow_call:
    inputs:
      check_versions:
        description: 'Also assert doc version stamps against package.json / Cargo.toml'
        type: boolean
        required: false
        default: false
      site_src:
        description: 'Space-separated site-source roots (default: site/src)'
        type: string
        required: false
        default: ''
      wicked_ci_ref:
        description: 'wicked-ci ref to take the lint script + registry from'
        type: string
        required: false
        default: 'v1'

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mikeparcewski/wicked-ci
          ref: ${{ inputs.wicked_ci_ref }}
          path: .wicked-ci-docs-lint
      - name: docs lint
        env:
          DL_CHECK_VERSIONS: ${{ inputs.check_versions }}
          DL_SITE_SRC: ${{ inputs.site_src }}
        run: |
          ARGS=""
          [ "$DL_CHECK_VERSIONS" = "true" ] && ARGS="$ARGS --check-versions"
          for s in $DL_SITE_SRC; do ARGS="$ARGS --site-src $s"; done
          python3 .wicked-ci-docs-lint/docs-lint/docs_lint.py . $ARGS
      - name: remove lint tooling checkout
        if: always()
        run: rm -rf .wicked-ci-docs-lint
