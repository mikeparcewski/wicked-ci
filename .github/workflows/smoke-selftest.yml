# Self-test for the smoke seam (the rules-conformance-selftest / docs-lint-reusable idiom): every PR
# that touches the harness or its workflow runs the REUSABLE smoke.yml from THIS ref against the
# current published set on ubuntu + macos — proving the workflow_call seam end-to-end before any
# consumer adopts it. A `workflow_dispatch` is only possible once the file is on the default branch
# (GitHub resolves dispatchable workflows there); until then the pull_request run is the proof.
name: smoke-selftest

on:
  pull_request:
    branches: [main]
    paths:
      - 'smoke/**'
      - '.github/workflows/smoke.yml'
      - '.github/workflows/smoke-selftest.yml'
  workflow_dispatch:
    inputs:
      crew_version:
        description: 'wicked-crew npm version'
        type: string
        default: 'latest'
      steps:
        description: 'Steps (empty = default set)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # The default composition: crew latest with the core-ts its range resolves TODAY (`pinned`) —
  # crew 0.7.33 / core-ts 0.7.24 at the time of writing: S05 must PASS, S04 must run through the
  # engine's deliver gate to the local bare origin.
  smoke:
    uses: ./.github/workflows/smoke.yml
    with:
      crew_version: ${{ inputs.crew_version || 'latest' }}
      steps: ${{ inputs.steps || '' }}
      os_matrix: '["ubuntu-latest","macos-latest"]'
      wicked_ci_ref: ${{ github.event.pull_request.head.sha || github.sha }}
  # The PREVIOUS published set (crew 0.7.32 / core-ts 0.7.23, explicitly pinned) — the expected-fail
  # policy must read honestly on the set a customer who has not upgraded still runs: S05 EXPECTED-FAIL
  # (F-E2E-021) with the malformed loop actually observed, S04's deliver-gate check EXPECTED-FAIL
  # (F-E2E-030). One macOS leg keeps runner minutes low; its artifacts carry the `prev` suffix so the
  # two invocations' verdict folds never see each other's legs.
  smoke-previous-set:
    uses: ./.github/workflows/smoke.yml
    with:
      crew_version: '0.7.32'
      core_ts_version: '0.7.23'
      steps: ${{ inputs.steps || '' }}
      os_matrix: '["macos-latest"]'
      artifact_suffix: prev
      wicked_ci_ref: ${{ github.event.pull_request.head.sha || github.sha }}
