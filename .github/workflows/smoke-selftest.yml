# Self-test for the smoke seam (the rules-conformance-selftest / docs-lint-reusable idiom): every PR
# that touches the harness or its workflow runs the REUSABLE smoke.yml from THIS ref against the
# current published set on ubuntu + macos — proving the workflow_call seam end-to-end before any
# consumer adopts it. A `workflow_dispatch` is only possible once the file is on the default branch
# (GitHub resolves dispatchable workflows there); until then the pull_request run is the proof.
name: smoke-selftest

on:
  pull_request:
    branches: [main]
    paths:
      - 'selftest/**'
      - '.github/workflows/smoke.yml'
      - '.github/workflows/smoke-selftest.yml'
      - '.github/workflows/selftest.yml'
  workflow_dispatch:
    inputs:
      crew_version:
        description: 'wicked-crew npm version'
        type: string
        default: 'latest'
      steps:
        description: 'Steps (empty = default set)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # The default composition: crew latest with the core-ts its range resolves TODAY (`pinned`) —
  # crew 0.7.33 / core-ts 0.7.24 at the time of writing: S05 must PASS, S04 must run through the
  # engine's deliver gate to the local bare origin.
  smoke:
    uses: ./.github/workflows/smoke.yml
    with:
      crew_version: ${{ inputs.crew_version || 'latest' }}
      steps: ${{ inputs.steps || '' }}
      os_matrix: '["ubuntu-latest","macos-latest"]'
      wicked_ci_ref: ${{ github.event.pull_request.head.sha || github.sha }}
  # The `pr` profile on the latest published set: the API steps a pull request runs plus the studio journeys
  # (U01-U03, Playwright Chromium against the daemon's own studio). One ubuntu leg; its artifacts carry `pr`.
  smoke-pr-profile:
    uses: ./.github/workflows/smoke.yml
    with:
      crew_version: ${{ inputs.crew_version || 'latest' }}
      profile: pr
      os_matrix: '["ubuntu-latest"]'
      artifact_suffix: pr
      wicked_ci_ref: ${{ github.event.pull_request.head.sha || github.sha }}
  # The PREVIOUS set: the last CERTIFIED train, a coherent crew + core-ts + garden set (wicked-ci#93). It is the set a
  # customer who has not upgraded still runs, and its three parts were certified together. Train 15:
  # wicked-crew 0.18.23, wicked-core-ts 0.15.51, wicked-garden 12.68.8. The release lane moves it forward at each
  # train's certification. Never mix a set's parts with today's (`latest`): crew 0.7.32 + core-ts 0.7.23 under the
  # newest garden refused every launch once garden 12.69.0 retired skills that old core's built-in workflows name
  # (wicked-garden#1600). One macOS leg keeps runner minutes low; its artifacts carry the `prev` suffix so the two
  # invocations' verdict folds never see each other's legs.
  smoke-previous-set:
    uses: ./.github/workflows/smoke.yml
    with:
      crew_version: '0.18.23'
      core_ts_version: '0.15.51'
      garden_ref: '12.68.8'
      steps: ${{ inputs.steps || '' }}
      os_matrix: '["macos-latest"]'
      artifact_suffix: prev
      wicked_ci_ref: ${{ github.event.pull_request.head.sha || github.sha }}
  # The PR-CI reusable workflow on the `main` set: every repo packed from its main (Tier 1 with studio under test, Tier 2
  # with core under test, so the napi build path runs too). Not advisory here: wicked-ci's own change must not break it.
  selftest-main-set:
    # The called workflow's advisory verdict job publishes a check run (wicked-ci #76); blocking mode skips it, but
    # GitHub checks a nested job's permissions against the caller's before the run starts.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/selftest.yml
    with:
      under_test: studio
      head_ref: main
      advisory: false
      wicked_ci_ref: ${{ github.event.pull_request.head.sha || github.sha }}
  selftest-main-set-tier2:
    # The called workflow's advisory verdict job publishes a check run (wicked-ci #76); blocking mode skips it, but
    # GitHub checks a nested job's permissions against the caller's before the run starts.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/selftest.yml
    with:
      under_test: core
      head_ref: main
      advisory: false
      wicked_ci_ref: ${{ github.event.pull_request.head.sha || github.sha }}
